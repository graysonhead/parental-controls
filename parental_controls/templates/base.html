<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{% block title %}Parental Controls{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/base.css">
    {% block extra_css %}{% endblock %}
    <script src="/static/js/htmx.min.js"></script>
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block content %}{% endblock %}
    <script>
    (function () {
        var p = window.location.pathname;
        if (!p.startsWith('/admin') && !p.startsWith('/child')) return;
        var TIMEOUT = 300000;
        var timer;
        function reset() { clearTimeout(timer); timer = setTimeout(doLogout, TIMEOUT); }
        function doLogout() {
            var f = document.createElement('form');
            f.method = 'POST'; f.action = '/logout';
            document.body.appendChild(f); f.submit();
        }
        ['mousemove','mousedown','keydown','touchstart','touchmove','scroll','click']
            .forEach(function(e) { document.addEventListener(e, reset, {passive: true}); });
        reset();
    })();
    </script>
</body>
</html>
