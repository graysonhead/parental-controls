[tool.poetry]
name = "parental-controls"
version = "0.1.0"
description = "Parental controls web service with chore tracking and time-based device access"
authors = ["Grayson Head <grayson@graysonhead.net>"]
packages = [
  {include = "parental_controls"},
  {include = "parental_controls_agent"},
]

[tool.poetry.scripts]
parental-controls-server = "parental_controls.main:run_server"
parental-controls-agent = "parental_controls_agent.__main__:main"

[tool.poetry.dependencies]
python = "^3.13"
fastapi = {extras = ["standard"], version = "^0.115"}
sqlmodel = "^0.0.22"
aiosqlite = "^0.20"
pydantic-settings = "^2.4"
bcrypt = "^4.2"
itsdangerous = "^2.2"

[tool.poetry.group.agent.dependencies]
httpx = "^0.27"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24"
pytest-cov = "^6.0"
httpx = "^0.27"
black = "^25.0.0"
ruff = "^0.9.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
